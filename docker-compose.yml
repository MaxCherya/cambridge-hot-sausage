services:
  backend:
    build: ./server
    ports:
      - "8000:8000"
    env_file: ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bind to loopback only — unauthenticated Redis must never be
    # reachable from the network. Inter-container access still works
    # via the compose network.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
